[package]
name = "album"
version = "0.1.0"
edition = "2024"

[dependencies]
axum= { version = "0.8", features = ["default", "multipart"] }
tokio = { version= "1.47.1",features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json="1.0"
function_name = "0.3"
mime_guess = "2.0.5"
headers = "0.4.1"
tokio-util = { version="0.7.16",features = ["full"] }
async-recursion = "1.0"
thiserror = "2.0.16"
percent-encoding = "2.3.2"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1.89"
futures = "0.3.31"
argon2 = {version = "0.5",features = ["std"]}
rand_core = "0.9.3"
rand = "0.9.2"
base64 = "0.21.0"
sha2 = "0.11.0-rc.2"
multer = "3.1.0"