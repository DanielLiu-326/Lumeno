[package]
name = "lumeno"
version = "0.1.0"
edition = "2024"

[dependencies]
axum= { version = "0.8", features = ["default", "multipart"] }
tokio = { version= "1.47.1",features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json="1.0"
function_name = "0.3"
mime_guess = "2.0.5"
headers = "0.4.1"
tokio-util = { version="0.7.16",features = ["full"] }
async-recursion = "1.0"
thiserror = "2.0.16"
percent-encoding = "2.3.2"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1.89"
futures = "0.3.31"
argon2 = {version = "0.5",features = ["std"]}
rand_core = "0.9.3"
rand = "0.9.2"
base64 = "0.21.0"
sha2 = "0.11.0"
hmac = "0.13.0"
multer = "3.1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp"] }
libheif-rs = { version = "2.7", default-features = false, features = ["v1_17", "image"] }
# Vendored rsraw-sys ships LibRaw 0.22.2 (S5 MkII / GH6 RW2, etc.).
# crates.io rsraw-sys still vendors 0.21.3 which demosaics those as noise.
rsraw = "0.1.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
kamadak-exif = "0.6"
rust-i18n = "3.1.2"
dav-server = { version = "0.11.0", features = ["localfs"] }
quick-xml = "0.37"
burn = { version = "0.21.0", default-features = false, features = ["std", "flex", "store", "dispatch", "vulkan"] }
burn-store = "0.21"
# Direct dep so we can build a Custom CubeCL memory pool (tight VRAM).
cubecl-runtime = "0.10"
half = "2"
rayon = "1.12.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[features]
# Optional NVIDIA CUDA (needs CUDA toolkit at build time). Vulkan GPU is always compiled in.
default = []
cuda = ["burn/cuda"]

[build-dependencies]
burn-onnx = "0.21"
sha2 = "0.11.0"

[patch.crates-io]
rsraw-sys = { path = "vendor/rsraw-sys" }
